name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/spmj_ci?schema=public"
  AUTH_SECRET: "ci-only-dummy-secret-0123456789abcdef"
  AUTH_URL: "http://localhost:3100"
  NEXTAUTH_URL: "http://localhost:3100"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, seed, build dan E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spmj_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sediakan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang kebergantungan
        run: npm ci

      - name: Jana Prisma Client
        run: npx prisma generate

      - name: Sediakan pangkalan data CI
        run: npx prisma migrate deploy

      - name: Seed data demo
        run: npm run db:seed

      - name: Semak jenis TypeScript
        run: npm run typecheck

      - name: Bina aplikasi
        run: npm run build

      - name: Pasang pelayar Playwright
        run: npx playwright install --with-deps chromium

      - name: Ujian E2E
        run: npx playwright test
